# ------------------------------------------------------------
#  Lab members. The page has two sections, Current and Alumni.
#  Section is set per person by `status`:
#    status: alumni  -> Alumni section (omit for current members)
#  Within each section people are ordered by seniority using `group`
#  (see $roleOrder in layouts/people/list.html):
#    Principal Investigator | Postdoctoral Researchers |
#    PhD Students | Research Assistants & Staff | Team
#
#  Optional per person: photo (file in static/images/people/),
#  blurb, email, scholar, github.
#
#  NOTE: roles marked "Team member" below need confirming, and most
#  members still need a short blurb and a headshot (drop a JPG into
#  static/images/people/ and set `photo:`). Alex & Emma are complete.
# ------------------------------------------------------------
members:
  - name: "Alex Frankell"
    role: "Group Leader · Assistant Professor"
    group: "Principal Investigator"
    photo: "alex-frankell.jpg"
    blurb: "Alex leads the Somatic Evolution Monitoring Lab at the Early Cancer Institute. He completed his PhD at the MRC Cancer Unit, University of Cambridge, where he led whole-genome sequencing analysis in the Oesophageal ICGC project and followed up his findings in plasma circulating tumour DNA. He then undertook a postdoctoral fellowship at UCL and the Francis Crick Institute as part of the TRACERx study, using multiregional sequencing and longitudinal plasma sampling to uncover novel patterns of clonal evolution and biomarkers in non-small cell lung cancer. He has since developed multiple novel methods and intellectual property, including computational and experimental approaches to track cancer evolution across space and time, such as cloneMap, ECLIPSE and ParallelGDDetect. He holds an 8 year, £2.6M Wellcome Career Development Award alongside several other project grants which support the lab's work."
    email: "amf71@cam.ac.uk"
    scholar: "https://scholar.google.com/citations?user=2xS5m4gAAAAJ&hl=en"
    twitter: "https://x.com/AFrankell"
    linkedin: "https://www.linkedin.com/in/alexander-frankell-92861599/"

  - name: "Emma Hazelwood"
    role: "Postdoctoral Research Fellow in Cancer Evolution"
    group: "Postdoctoral Researchers"
    photo: "emma-hazelwood.jpg"
    blurb: "Emma joined the lab as a postdoc, after completing her PhD in Cancer Epidemiology at the University of Bristol in 2024. Emma now works on developing spatial DNA sequencing technologies and contributing to the TRACERx lung cancer project, focussing on germline analyses. Alongside her position in the Frankell lab, Emma also holds the Everitt Butterfield Research Fellowship at Downing College. Outside of work, she enjoys watching live music and participating in pub quizzes."

  - name: "Lianlian (Leanne) Wu"
    role: "Clinical Research Associate"
    group: "Postdoctoral Researchers"
    photo: "leanne-wu.jpg"
    blurb: "Leanne is a Clinical Research Associate co-supervised by Prof. Rebecca Fitzgerald and Dr. Alex Frankell. She received her M.D. (PhD equivalent) from Wuhan University in 2020 and previously worked as a gastroenterologist in China, where she co-led the development and clinical translation of EndoAngle, an artificial intelligence system that improved the endoscopic detection of early gastrointestinal cancers. Since joining Cambridge in 2023, her research has evolved from AI-assisted endoscopy to cancer genomics, with a particular focus on using copy-number alterations and minimally invasive sampling approaches for early cancer detection and risk stratification. Her long-term goal is to integrate minimally invasive sampling, multi-omics and AI to enable biology-driven risk prediction and personalised screening and surveillance for GI cancers."

  - name: "Woody Zhidong Zhang"
    role: "PhD Student"
    group: "PhD Students"
    photo: "woody-zhang.jpg"
    blurb: "Woody studied computational biology at Sichuan University before completing an MPhil in Chemical Pathology with Professor Dennis Lo at the Chinese University of Hong Kong, where he studied cell-free DNA biology and its applications in non-invasive prenatal and cancer testing. He joined the Frankell lab as a PhD student in 2024. His research focuses on developing sensitive computational genomics methods to detect chromosomal instability and track tumour evolution in non-invasive samples, including circulating tumour DNA and capsule sponges. He applies these methods to some of the most lethal cancers, including lung and oesophageal cancers, with the aim of improving early detection and risk stratification. Outside the lab, Woody enjoys football, hiking and photography."

  - name: "Katie Honan"
    role: "PhD Student"
    group: "PhD Students"
    photo: "katie-honan.jpg"
    blurb: "Katie is a PhD student investigating the evolutionary processes that drive cancer progression using genomic data from tumour tissue and circulating tumour DNA (ctDNA). Her research leverages computational cancer genomics to study clonal evolution, metastatic dissemination, and the transition from premalignant disease to invasive cancer across multiple tumour types. Before joining the lab, she completed an MSc in Bioinformatics at the University of Birmingham and worked as a bioinformatician in the Cancer Molecular Diagnostics Laboratory at the University of Cambridge, where she developed scalable bioinformatics pipelines for the analysis of clinical next-generation sequencing data. In her free time, Katie enjoys running, swimming and travelling."

  - name: "Thomas Pons"
    role: "PhD Student"
    group: "PhD Students"
    photo: "thomas-pons.jpg"
    blurb: "Thomas is a PhD student jointly supervised by Dr Alex Frankell and Prof Rebecca Fitzgerald. He graduated with an MSci in Natural Sciences from the University of Exeter, where his master's research explored the neuroendocrine stress response in rats. His current research focuses on leveraging copy-number alterations alongside other multi-omic features to identify putative biomarkers for the early detection of oesophageal squamous cell carcinoma. He ultimately aims to integrate these with the non-endoscopic capsule sponge to produce a clinically relevant screening tool for the disease."

  - name: "Tiantian Ye"
    role: "Visiting Scholar"
    group: "Team"
    status: "alumni"
    photo: "tiantian-ye.jpg"
    blurb: "Tiantian is an Associate Professor in the Department of Chemistry at Wuhan University, where her research uses mass spectrometry to study nucleic acid modifications. She joined the Frankell lab as a visiting scholar for one year from 2025 to 2026, during which she established critical in vitro models of cell-free DNA shedding using blood- and tumour-matched samples from the same individuals. These models now provide an infinite, reproducible source of ctDNA admixtures used for analytical benchmarking across several other projects in the lab. Tiantian has since returned to her position at Wuhan University, taking the skills she gained in Cambridge back into her own research."

  - name: "Fabiola (Fabi) Roman Maldonado"
    role: "Senior Research Technician in NGS"
    group: "Research Assistants & Staff"
    photo: "fabiola-roman-maldonado.jpg"
    blurb: "Fabi has an MSc and PhD in Parasitology from FIOCRUZ, Brazil, where her work focused on the genetic diversity of the parasite that causes Chagas disease in South America. In 2020 she joined the Sanger Institute in Sequencing Operations, working on library preparation for the Tree of Life project using PacBio and Illumina platforms, and also developed expertise in Hi-C processing of ultra-low input samples. She joined the Frankell lab to focus on duplex sequencing and is also driving the development of spatial genomics techniques."

  - name: "Hannah Bazin"
    role: "Master's Student"
    group: "Team"
    status: "alumni"
    photo: "hannah-bazin.jpg"
    blurb: "Hannah completed her undergraduate degree in Life Sciences Engineering at EPFL in Switzerland, including an exchange year in Biomedical Engineering at Johns Hopkins University in Baltimore. She then spent time at the Milner Therapeutics Institute in Cambridge before joining the Frankell lab for four months in 2026 as part of her Master's degree at the University of Cambridge. Her project used personalised deep sequencing of thousands of mutations across hundreds of samples from the TRACERx study to identify new determinants of differential circulating tumour DNA (ctDNA) shedding between clonal mutations. Hannah is now undertaking a PhD in Blood Cancer Evolution at the University of Cambridge."

  - name: "Janhavi Rastogi"
    role: "Research Assistant"
    group: "Research Assistants & Staff"
    photo: "janhavi-rastogi.jpg"
    blurb: "Janhavi received her M.Sc. in Biomedical Science from the University of Bristol, where her final-year research focused on cell synchronisation in osteoarthritis. She then joined the CRUK Manchester Institute, investigating circulating tumour cells (CTCs) as biomarkers for cancer detection in Prof Caroline Dive's Laboratory. Since joining the Frankell Lab in January 2026, her research has focused on advancing early cancer detection through the longitudinal analysis of circulating tumour DNA (ctDNA), with the aim of improving our understanding of tumour evolution and disease monitoring."

  - name: "Jie (Jason) Sheng Aik"
    role: "Undergraduate Summer Student"
    group: "Team"
    status: "alumni"
    # photo: pending - drop a JPG into static/images/people/ and set e.g. "jason-aik.jpg" once available
    blurb: "Jason joined the lab for four months in 2024 as a summer student during his Natural Sciences undergraduate degree at the University of Cambridge. His project explored mechanisms for stabilising cell-free DNA using in vitro models and synthetic, chemically modified nucleic acids designed against a panel of common hotspot mutations that he defined from large-scale next-generation sequencing data. Jason is now undertaking a Master's degree in Chemistry at the University of Cambridge."

  - name: "Tim Somerset"
    role: "Computational Research Assistant"
    group: "Research Assistants & Staff"
    photo: "tim-somerset.jpg"
    blurb: "Tim is a research assistant jointly supervised by Prof Rebecca Fitzgerald and Dr Alex Frankell, working on bioinformatics and clinical statistics at the Early Cancer Institute. He completed an MPhil in Computational Biology at the University of Cambridge. With the SEM lab he builds bioinformatic pipelines for new sequencing cohorts and develops statistical methods for quality control in clinical shallow whole-genome sequencing projects, including a method for detecting sample swaps in large multiregion sequencing datasets. His broader work with the Fitzgerald group includes biomarker discovery in Barrett's oesophagus and clinical trial statistics for cancer screening studies."
